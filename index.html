<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload the two text faces used above the fold; same-origin files avoid a third-party font connection. -->
    <link rel="preload" href="/assets/fonts/SpaceGrotesk-variable-v1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/Manrope-variable-v1.ttf" as="font" type="font/ttf" crossorigin />
    <!--route-head-->
    <!-- The browser suggestion/tab icon is the exact approved navy-and-russet
         symbol, on transparency. A new URL avoids stale favicon caches.
         Do not swap in a generated or white-filled illustration. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/leqad-favicon-180-v1.png" />
  </head>
  <body class="bg-[#FAF8F4] text-[#0E2943] antialiased selection:bg-[#B74B21]/15 selection:text-[#0E2943]">

  </body>
