<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
  <title>First CAD sketch — a dimensioned rectangle</title>
  <desc>A simplified technical drawing, not an interactive CAD interface. A 40 by 30 millimeter rectangle sits on a faint grid with a marked origin and X and Y axes.</desc>
  <defs>
    <clipPath id="sheet"><rect width="780" height="440" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#sheet)">
    <rect width="780" height="440" fill="#EDF1F3"/>
    <g stroke="#C9D4DB" stroke-width="1" opacity=".7" fill="none">
  <path d="M28 0V440"/>
  <path d="M78 0V440"/>
  <path d="M128 0V440"/>
  <path d="M178 0V440"/>
  <path d="M228 0V440"/>
  <path d="M278 0V440"/>
  <path d="M328 0V440"/>
  <path d="M378 0V440"/>
  <path d="M428 0V440"/>
  <path d="M478 0V440"/>
  <path d="M528 0V440"/>
  <path d="M578 0V440"/>
  <path d="M628 0V440"/>
  <path d="M678 0V440"/>
  <path d="M728 0V440"/>
  <path d="M0 26H780"/>
  <path d="M0 76H780"/>
  <path d="M0 126H780"/>
  <path d="M0 176H780"/>
  <path d="M0 226H780"/>
  <path d="M0 276H780"/>
  <path d="M0 326H780"/>
  <path d="M0 376H780"/>
  <path d="M0 426H780"/>
    </g>
    <rect x="23" y="22" width="734" height="396" rx="8" fill="none" stroke="#C2CFD7" stroke-width="1"/>
    <text x="45" y="63" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="1.4" font-weight="700" fill="#0E2943">2D SKETCH</text>
    <text x="736" y="63" font-family="Arial,Helvetica,sans-serif" text-anchor="end" font-size="18" fill="#55616B">TOP PLANE (XY)</text>
    <!-- Dimension extension lines intentionally read as a technical drawing, not controls. -->
    <g fill="none" stroke="#55616B" stroke-width="1.5">
      <path d="M224 136V108 M504 136V108 M224 111H504"/>
      <path d="M224 107V115 M504 107V115"/>
      <path d="M504 136H543 M504 346H543 M538 136V346"/>
      <path d="M534 136H542 M534 346H542"/>
    </g>
    <text x="364" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="#0E2943">40 mm</text>
    <text x="553" y="249" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="#0E2943">30 mm</text>
    <rect x="224" y="136" width="280" height="210" fill="#0E2943" fill-opacity=".08" stroke="#0E2943" stroke-width="3.5"/>
    <circle cx="504" cy="136" r="5" fill="#793327"/>
    <circle cx="224" cy="346" r="11" fill="none" stroke="#793327" stroke-dasharray="4 4" stroke-width="2"/>
    <circle cx="224" cy="346" r="4.5" fill="#793327"/>
    <!-- CAD axis convention: red X, green Y. -->
    <path d="M224 346H331" stroke="#E11D48" stroke-width="3" fill="none"/>
    <path d="M335 346l-11-5v10z" fill="#E11D48"/>
    <text x="347" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#C01F43">+X</text>
    <path d="M224 346V248" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M224 242l-5 11h10z" fill="#10B981"/>
    <text x="190" y="239" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#07855E">+Y</text>
    <text x="239" y="385" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#793327">Origin (0,0)</text>
  </g>
</svg>