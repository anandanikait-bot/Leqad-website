name: Website demo checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/demo-extrude-step-stability]

jobs:
  test-website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build and prerender
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser playtest
        env:
          CI: 'true'
        run: npm run test:browser
      - name: Upload step-by-step demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-step-visual-review
          path: test-results/demo-*.png
          if-no-files-found: ignore
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
